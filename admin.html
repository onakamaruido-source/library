<!DOCTYPE html>
<html lang="ja">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>蔵書管理</title>


<link rel="stylesheet" href="style.css">


</head>



<body>



<header>


<h1>
🎼 蔵書管理
</h1>



<a href="index.html" class="nav-button">

📚 トップページ

</a>


</header>





<main>




<section class="card">


<h2>
楽譜追加
</h2>



<input id="title"
placeholder="曲名">



<input id="publisher"
placeholder="出版社">



<input id="composer"
placeholder="作曲者">



<input id="arranger"
placeholder="編曲者">



<input id="difficulty"
placeholder="グレード">



<input id="missing"
placeholder="不足譜（例:Tuba,Flute）">



<button onclick="addBook()">

追加

</button>



</section>






<h2>
登録済み楽譜
</h2>



<div id="list"></div>





</main>







<script src="config.js"></script>


<script>



let books=[];






async function loadBooks(){


let res =
await fetch(API_URL);



books =
await res.json();



display();


}








function display(){


let area =
document.getElementById("list");


area.innerHTML="";



books.forEach(b=>{


let url =

location.href
.replace(
"admin.html",
"detail.html"
)

+
"?id="
+
b.id;




area.innerHTML+=`



<div class="card">



<h3>

${b.title}

</h3>



<p>

出版社：
${b.publisher}

</p>



<img

src="https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${encodeURIComponent(url)}"

>



<br>



<button onclick="deleteBook('${b.id}')">

削除

</button>


<a href="detail.html?id=${b.id}">

<button>

詳細

</button>

</a>



</div>



`;



});


}









async function addBook(){



let data={


action:"add",


title:
title.value,


publisher:
publisher.value,


composer:
composer.value,


arranger:
arranger.value,


difficulty:
difficulty.value,


missing:
missing.value



};





await fetch(

API_URL,

{


method:"POST",


body:
JSON.stringify(data)


}

);



alert("追加しました");



loadBooks();



}










async function deleteBook(id){



if(!confirm("削除しますか？")){

return;

}



await fetch(

API_URL,

{


method:"POST",


body:
JSON.stringify({

action:"delete",

id:id

})


}

);



alert("削除しました");



loadBooks();



}





loadBooks();



</script>


</body>


</html>
