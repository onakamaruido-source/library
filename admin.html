<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>吹奏楽部 蔵書管理</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🎼 ライブラリアン管理</h1>

<a href="index.html" class="nav-button">
📚 蔵書一覧へ戻る
</a>

</header>




<main>



<section class="card">


<h2 id="formTitle">
楽譜追加
</h2>



<input id="title" placeholder="曲名">

<input id="publisher" placeholder="出版社">

<input id="composer" placeholder="作曲者">

<input id="arranger" placeholder="編曲者">

<input id="difficulty" placeholder="グレード">


<textarea id="missing"
placeholder="不足譜（カンマ区切り）">
</textarea>



<button onclick="saveBook()">

保存

</button>



</section>





<section>


<h2>
登録楽譜
</h2>



<button onclick="printSelected()">

🖨 選択したQRを印刷

</button>



<div id="list"></div>



</section>



</main>







<script src="data.js"></script>


<script>


let books =

JSON.parse(
localStorage.getItem("books")
)

||

[];




let editId =

new URLSearchParams(location.search)
.get("id");







// 編集読み込み

if(editId){


let b =
books.find(
x=>x.id==editId
);


if(b){


document.getElementById("formTitle")
.innerText="楽譜編集";


title.value=b.title;

publisher.value=b.publisher;

composer.value=b.composer;

arranger.value=b.arranger;

difficulty.value=b.difficulty;

missing.value=b.missing.join(",");



}



}








function save(){


localStorage.setItem(

"books",

JSON.stringify(books)

);


}









function saveBook(){



let data={


title:title.value,


publisher:publisher.value,


composer:composer.value,


arranger:arranger.value,


difficulty:difficulty.value,


missing:
missing.value
.split(",")
.map(x=>x.trim())
.filter(x=>x!=""),



parts:[

"Score",
"Flute",
"Clarinet",
"Alto Sax",
"Trumpet",
"Horn",
"Trombone",
"Euphonium",
"Tuba",
"Percussion"

]


};






if(editId){


let index =
books.findIndex(
b=>b.id==editId
);



books[index]={

...books[index],

...data

};


alert("更新しました");


}else{


data.id =
Date.now().toString();



books.push(data);


alert("追加しました");


}



save();


location.href="admin.html";


}









function display(){



let area =
document.getElementById("list");


area.innerHTML="";




books.forEach((b,i)=>{


let url =

location.href.replace(
"admin.html",
"detail.html"
)

+

"?id="

+

b.id;





area.innerHTML+=`


<div class="card">



<label>

<input 
type="checkbox"
class="qr-select"
value="${b.id}"
>

QR印刷

</label>



<h3>

${b.title}

</h3>



<p>

出版社：
${b.publisher}

</p>





<img

class="qr"

src="https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${encodeURIComponent(url)}"

>



<p>

${b.title}

</p>




<br>



<a href="detail.html?id=${b.id}">

<button>

詳細

</button>

</a>



<a href="admin.html?id=${b.id}">

<button>

編集

</button>

</a>




<button onclick="printOne(${i})">

個別印刷

</button>




<button onclick="deleteBook(${i})">

削除

</button>




</div>


`;



});


}










function deleteBook(i){


if(confirm("削除しますか？")){


books.splice(i,1);


save();


display();


}


}









// 個別印刷

function printOne(i){


printBooks(
[
books[i]
]

);


}








// 複数印刷

function printSelected(){



let checked =

document.querySelectorAll(
".qr-select:checked"
);



let selected=[];



checked.forEach(c=>{


let b =

books.find(
x=>x.id==c.value
);



selected.push(b);



});




if(selected.length==0){


alert("選択してください");


return;


}



printBooks(selected);


}









function printBooks(list){



let html=`


<!DOCTYPE html>

<html>


<head>


<style>


body{

font-family:sans-serif;

}


.container{


display:grid;

grid-template-columns:
repeat(5,1fr);

gap:15px;


}



.label{


text-align:center;

font-size:11px;


}


.label img{


width:80px;

height:80px;


}



</style>


</head>



<body>



<div class="container">


`;





list.forEach(b=>{


let url =

location.href.replace(
"admin.html",
"detail.html"
)

+

"?id="

+

b.id;



html+=`


<div class="label">


<img

src="https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${encodeURIComponent(url)}"

>


<br>


${b.title}



</div>


`;



});




html+=`


</div>


</body>


</html>


`;





let w =
window.open("");



w.document.write(html);


w.document.close();



setTimeout(()=>{


w.print();


},500);



}






display();



</script>


</body>

</html>
