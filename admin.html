<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>吹奏楽部 蔵書管理</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🎼 蔵書管理</h1>


<a href="index.html" class="nav-button">
📚 トップページ
</a>


</header>



<main>



<section class="card">


<h2 id="formTitle">
楽譜追加
</h2>



<input id="title"
placeholder="曲名">


<input id="publisher"
placeholder="出版社">


<input id="composer"
placeholder="作曲者">


<input id="arranger"
placeholder="編曲者">


<input id="difficulty"
placeholder="グレード">


<input id="missing"
placeholder="不足譜（例：Tuba,Flute）">



<button onclick="saveBook()">

追加

</button>


</section>





<h2>
登録楽譜
</h2>



<div id="list"></div>



</main>





<script src="config.js"></script>


<script>


let books=[];


let editId =
new URLSearchParams(location.search)
.get("id");






async function loadBooks(){


let res =
await fetch(API_URL);



books =
await res.json();



display();



if(editId){

loadEdit();

}


}








function display(){



let area =
document.getElementById("list");


area.innerHTML="";



books.forEach(book=>{


let url =

location.href
.replace(
"admin.html",
"detail.html"
)

+
"?id="
+
book.id;



area.innerHTML+=`


<div class="card">


<h3>

${book.title}

</h3>


<p>
出版社：
${book.publisher}
</p>


<p>
作曲：
${book.composer}
</p>


<p>
編曲：
${book.arranger}
</p>



<img

src="https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${encodeURIComponent(url)}"

>


<br>



<a href="detail.html?id=${book.id}">

<button>
詳細
</button>

</a>



<a href="admin.html?id=${book.id}">

<button>
編集
</button>

</a>



<button onclick="deleteBook('${book.id}')">

削除

</button>



</div>



`;



});



}









function loadEdit(){



let book =

books.find(

b=>String(b.id)
===
String(editId)

);



if(!book){

return;

}



document.getElementById("formTitle")
.innerText="楽譜編集";



title.value =
book.title;


publisher.value =
book.publisher;


composer.value =
book.composer;


arranger.value =
book.arranger;


difficulty.value =
book.difficulty;


missing.value =
book.missing;



}









async function saveBook(){



let data={



title:
document.getElementById("title").value,


publisher:
document.getElementById("publisher").value,


composer:
document.getElementById("composer").value,


arranger:
document.getElementById("arranger").value,


difficulty:
document.getElementById("difficulty").value,


missing:
document.getElementById("missing").value



};





if(data.title==""){


alert("曲名を入力してください");


return;


}






if(editId){


data.action="update";

data.id=editId;


}else{


data.action="add";


}





await fetch(

API_URL,

{


method:"POST",


mode:"no-cors",


body:

JSON.stringify(data)


}

);



alert(

editId ?

"更新しました"

:

"追加しました"

);



location.href="admin.html";



}









async function deleteBook(id){



if(
!confirm("削除しますか？")
){

return;

}





await fetch(

API_URL,

{


method:"POST",


mode:"no-cors",


body:

JSON.stringify({

action:"delete",

id:id

})


}

);



alert("削除しました");


loadBooks();



}






loadBooks();



</script>


</body>

</html>
