<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>吹奏楽部 蔵書確認</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🎼 吹奏楽部 蔵書確認</h1>


<a href="admin.html" class="nav-button">

⚙ 管理ページ

</a>


</header>




<main>


<section class="search-box">


<input 
id="search"
placeholder="曲名・作曲者・編曲者で検索"
>


<button onclick="searchBook()">

検索

</button>


</section>



<h2>
楽譜一覧
</h2>


<div id="list"></div>



</main>






<script src="data.js"></script>


<script>



let books =
JSON.parse(
localStorage.getItem("books")
)
||
[];





function display(data=books){


let area =
document.getElementById("list");


area.innerHTML="";



data.forEach(book=>{


area.innerHTML+=`


<div class="card">


<h2>

<a href="detail.html?id=${book.id}">

${book.title}

</a>

</h2>



<p>

出版社：
${book.publisher}

</p>



<p>

作曲：
${book.composer}

</p>



<p>

編曲：
${book.arranger}

</p>



</div>


`;



});


}






function searchBook(){


let word =
document
.getElementById("search")
.value;



let result =
books.filter(book=>


book.title.includes(word)

||

book.composer.includes(word)

||

book.arranger.includes(word)


);



display(result);


}





display();



</script>


</body>

</html>
