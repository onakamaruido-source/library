<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>吹奏楽部 蔵書確認</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🎼 吹奏楽部 蔵書確認</h1>

<a href="admin.html" class="nav-button">
⚙ 管理ページ
</a>

</header>



<main>


<div class="card">

<input id="search"
placeholder="曲名・作編曲者検索">

<button onclick="searchBook()">
検索
</button>


<button onclick="printSelectedQR()">
🖨 QR印刷
</button>

</div>



<h2>楽譜一覧</h2>


<div id="list"></div>


</main>




<script src="config.js"></script>


<script>


let books=[];



async function loadBooks(){


let res =
await fetch(API_URL);



books =
await res.json();



display();


}




function display(data=books){


let area =
document.getElementById("list");


area.innerHTML="";



data.forEach(book=>{


area.innerHTML+=`

<div class="card">


<input type="checkbox"
class="qr-select"
value="${book.id}">


<h2>

<a href="detail.html?id=${book.id}">

${book.title}

</a>

</h2>


<p>
出版社：
${book.publisher}
</p>


<p>
作曲：
${book.composer}
</p>


<p>
編曲：
${book.arranger}
</p>


</div>

`;

});


}





function searchBook(){


let word =
document.getElementById("search").value;


display(

books.filter(b=>

b.title.includes(word)
||
b.composer.includes(word)
||
b.arranger.includes(word)

)

);


}







function printSelectedQR(){


let checks =
document.querySelectorAll(
".qr-select:checked"
);



let html=`


<html>

<head>

<style>

.container{

display:grid;

grid-template-columns:repeat(5,1fr);

gap:15px;

}


.label{

text-align:center;

font-size:11px;

}


.label img{

width:80px;

}


</style>

</head>

<body>

<div class="container">

`;



checks.forEach(c=>{


let b =
books.find(
x=>x.id==c.value
);



let url =
location.href.replace(
"index.html",
"detail.html"
)
+
"?id="
+
b.id;



html+=`

<div class="label">

<img src="https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${encodeURIComponent(url)}">

<br>

${b.title}

</div>

`;

});


html+=`

</div>

</body>

</html>

`;



let w=
window.open("");

w.document.write(html);

w.document.close();


setTimeout(()=>w.print(),500);


}




loadBooks();


</script>


</body>

</html>
