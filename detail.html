<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>楽譜詳細</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🎼 楽譜詳細</h1>


<a href="index.html" class="nav-button">
📚 蔵書一覧
</a>


<a href="admin.html" class="nav-button">
⚙ 管理ページ
</a>


</header>




<main>

<div id="detail"></div>

</main>





<script src="data.js"></script>


<script>


let books =

JSON.parse(
localStorage.getItem("books")
)

||

[];





let id =

new URLSearchParams(location.search)
.get("id");





let book =

books.find(
b=>b.id==id
);





let detail =
document.getElementById("detail");







if(!book){


detail.innerHTML=`

<div class="card">

<h2>
楽譜がありません
</h2>

<a href="index.html">
戻る
</a>

</div>

`;



}else{



detail.innerHTML=`



<div class="card">


<h1>
${book.title}
</h1>



<hr>



<p>
出版社：
${book.publisher || "未登録"}
</p>


<p>
作曲者：
${book.composer || "未登録"}
</p>


<p>
編曲者：
${book.arranger || "未登録"}
</p>


<p>
グレード：
${book.difficulty || "未登録"}
</p>




<h2>
不足譜
</h2>



${

book.missing &&
book.missing.length

?

`

<ul>

${
book.missing.map(

x=>

`

<li class="missing">

❌ ${x}

</li>

`

).join("")
}

</ul>

`

:

`

<p>
✅ 不足なし
</p>

`

}





<h2>
収録パート
</h2>


<ul>

${

book.parts

?

book.parts.map(

x=>

`

<li>
${x}
</li>

`

).join("")

:

"<li>未登録</li>"

}

</ul>





<br>



<button onclick="printQR()">

🖨 QR印刷

</button>




<a href="admin.html?id=${book.id}">

<button>

✏ 編集

</button>

</a>



</div>



`;



}









// QR印刷

function printQR(){



let url =
location.href;



let win =
window.open("");



win.document.write(`


<!DOCTYPE html>

<html>


<head>


<title>

${book.title}

</title>


<style>

body{

text-align:center;

font-family:sans-serif;

}


.qr{

width:200px;

}


</style>


</head>



<body>



<h1>

${book.title}

</h1>



<p>

出版社：
${book.publisher}

</p>



<p>

作曲：
${book.composer}

</p>



<p>

編曲：
${book.arranger}

</p>



<img class="qr"

src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}"

>



<p>

吹奏楽部 蔵書管理

</p>



</body>


</html>



`);



win.document.close();



setTimeout(()=>{

win.print();

},500);



}




</script>


</body>

</html>
