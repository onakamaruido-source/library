<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>楽譜詳細</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>🎼 楽譜詳細</h1>


<a href="index.html" class="nav-button">
📚 戻る
</a>


<a href="admin.html" class="nav-button">
⚙ 管理
</a>

</header>



<main>


<div id="detail"></div>


</main>



<script src="config.js"></script>


<script>


async function load(){


let books =
await fetch(API_URL)
.then(r=>r.json());



let id =
new URLSearchParams(location.search)
.get("id");



let b =
books.find(
x=>x.id==id
);



document.getElementById("detail")
.innerHTML=`

<div class="card">


<h1>
${b.title}
</h1>


<p>
出版社：
${b.publisher}
</p>


<p>
作曲者：
${b.composer}
</p>


<p>
編曲者：
${b.arranger}
</p>


<h2>
不足譜
</h2>


<p>
${b.missing || "なし"}
</p>



</div>

`;



}


load();


</script>


</body>

</html>
